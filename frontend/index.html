<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopApp — Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #0f0f0f;
      --white:  #fafaf8;
      --gray-1: #f4f3f0;
      --gray-2: #e8e6e1;
      --gray-3: #b0ada6;
      --gray-4: #6b6860;
      --radius: 2px;
      --transition: 200ms ease;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--white);
      color: var(--black);
    }

    /* NAVBAR */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      border-bottom: 1px solid var(--gray-2);
      position: sticky;
      top: 0;
      background: var(--white);
      z-index: 100;
    }

    .nav-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--black);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-user {
      font-size: 13px;
      color: var(--gray-4);
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--gray-2);
      padding: 7px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--gray-4);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
    }
    .btn-logout:hover { border-color: var(--black); color: var(--black); }

    .btn-cart {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 9px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity var(--transition);
    }
    .btn-cart:hover { opacity: 0.8; }

    .cart-count {
      background: var(--white);
      color: var(--black);
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* HERO */
    .hero {
      padding: 56px 48px 40px;
      border-bottom: 1px solid var(--gray-2);
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 52px;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 12px;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--gray-3);
    }

    .hero p {
      font-size: 15px;
      color: var(--gray-4);
      font-weight: 300;
    }

    /* FILTROS */
    .filters {
      padding: 20px 48px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--gray-2);
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--gray-2);
      padding: 7px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--gray-4);
      border-radius: 40px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .filter-btn:hover  { border-color: var(--black); color: var(--black); }
    .filter-btn.active { background: var(--black); border-color: var(--black); color: var(--white); }

    /* GRID */
    .catalog {
      padding: 40px 48px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1px;
      background: var(--gray-2);
      border: 1px solid var(--gray-2);
    }

    .product-card {
      background: var(--white);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background var(--transition);
      position: relative;
    }

    .product-card:hover { background: var(--gray-1); }

    .product-img {
      width: 100%;
      aspect-ratio: 1;
      background: var(--gray-1);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 4px;
    }

    .product-category {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-3);
    }

    .product-name {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--gray-2);
    }

    .product-price {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .product-stock {
      font-size: 12px;
      color: var(--gray-3);
    }

    .product-stock.low { color: #c07a1a; }
    .product-stock.out { color: #c0392b; }

    .btn-add {
      background: var(--black);
      color: var(--white);
      border: none;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity var(--transition), transform var(--transition);
      flex-shrink: 0;
    }
    .btn-add:hover   { opacity: 0.75; }
    .btn-add:active  { transform: scale(0.92); }
    .btn-add:disabled { background: var(--gray-2); color: var(--gray-3); cursor: not-allowed; }

    /* Estados */
    .state-msg {
      padding: 80px 0;
      text-align: center;
      color: var(--gray-3);
      font-size: 15px;
      grid-column: 1/-1;
      background: var(--white);
    }

    /* CARRITO LATERAL */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 300ms ease;
    }
    .cart-overlay.open { opacity: 1; pointer-events: all; }

    .cart-drawer {
      position: fixed;
      top: 0; right: 0;
      width: 400px; height: 100vh;
      background: var(--white);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 300ms ease;
      border-left: 1px solid var(--gray-2);
    }
    .cart-drawer.open { transform: translateX(0); }

    .cart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px;
      border-bottom: 1px solid var(--gray-2);
    }

    .cart-head h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      letter-spacing: -0.01em;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--gray-4);
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      transition: color var(--transition);
    }
    .btn-close:hover { color: var(--black); }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 20px 28px;
    }

    .cart-empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--gray-3);
    }

    .cart-empty span { font-size: 36px; }
    .cart-empty p    { font-size: 14px; }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--gray-1);
    }

    .ci-icon {
      width: 48px; height: 48px;
      background: var(--gray-1);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .ci-info { flex: 1; }

    .ci-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .ci-price { font-size: 13px; color: var(--gray-4); }

    .ci-qty {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    .qty-btn {
      background: var(--gray-1);
      border: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--black);
      transition: background var(--transition);
    }
    .qty-btn:hover { background: var(--gray-2); }

    .cart-foot {
      padding: 24px 28px;
      border-top: 1px solid var(--gray-2);
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
    }

    .cart-total-label { font-size: 13px; color: var(--gray-4); }

    .cart-total-amount {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    .btn-checkout {
      width: 100%;
      padding: 15px;
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity var(--transition);
      letter-spacing: 0.02em;
    }
    .btn-checkout:hover    { opacity: 0.8; }
    .btn-checkout.loading  { opacity: 0.5; pointer-events: none; }
    .btn-checkout:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--black);
      color: var(--white);
      padding: 12px 22px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all 300ms ease;
      z-index: 300;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      nav, .hero, .filters, .catalog { padding-left: 20px; padding-right: 20px; }
      .hero h1 { font-size: 36px; }
      .cart-drawer { width: 100vw; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a class="nav-brand" href="#">ShopApp</a>
    <div class="nav-right">
      <span class="nav-user" id="nav-user"></span>
      <button class="btn-logout" onclick="logout()">Salir</button>
      <button class="btn-cart" onclick="openCart()">
        Carrito
        <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>Catálogo <em>de</em><br>productos</h1>
    <p>Encontrá lo que necesitás.</p>
  </section>

  <!-- FILTROS -->
  <div class="filters">
    <button class="filter-btn active" onclick="filterProducts(null, this)">Todos</button>
    <button class="filter-btn" onclick="filterProducts('tech', this)">Tecnología</button>
    <button class="filter-btn" onclick="filterProducts('audio', this)">Audio</button>
  </div>

  <!-- GRID -->
  <main class="catalog">
    <div class="products-grid" id="products-grid">
      <div class="state-msg">Cargando productos...</div>
    </div>
  </main>

  <!-- CARRITO OVERLAY -->
  <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>

  <!-- CARRITO DRAWER -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-head">
      <h2>Tu carrito</h2>
      <button class="btn-close" onclick="closeCart()">&#x2715;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <div class="cart-empty">
        <span>&#9bag;</span>
        <p>El carrito está vacío</p>
      </div>
    </div>
    <div class="cart-foot">
      <div class="cart-total-row">
        <span class="cart-total-label">Total</span>
        <span class="cart-total-amount" id="cart-total">$0,00</span>
      </div>
      <button class="btn-checkout" id="btn-checkout" onclick="checkout()" disabled>
        Confirmar compra
      </button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // Iconos por categoría
    const ICONS = { tech: '&#128421;', audio: '&#127911;', default: '&#128722;' };

    let allProducts = [];

    // Verificar sesión
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      if (!token) return window.location.href = '/login.html';

      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        document.getElementById('nav-user').textContent = payload.email;
      } catch {}

      loadProducts();
    });

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        if (!res.ok) throw new Error('Error al cargar');
        allProducts = await res.json();
        renderProducts(allProducts);
      } catch (err) {
        document.getElementById('products-grid').innerHTML =
          `<div class="state-msg">No se pudieron cargar los productos.</div>`;
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('products-grid');

      if (products.length === 0) {
        grid.innerHTML = '<div class="state-msg">No hay productos en esta categoría.</div>';
        return;
      }

      grid.innerHTML = products.map(p => {
        const icon      = ICONS[p.category] || ICONS.default;
        const outOfStock = p.stock === 0;
        const lowStock   = p.stock > 0 && p.stock <= 3;
        const stockClass = outOfStock ? 'out' : lowStock ? 'low' : '';
        const stockText  = outOfStock ? 'Sin stock' : lowStock ? `Últimos ${p.stock}` : `Stock: ${p.stock}`;

        return `
          <div class="product-card">
            <div class="product-img">${icon}</div>
            <span class="product-category">${p.category || 'General'}</span>
            <h2 class="product-name">${p.name}</h2>
            <div class="product-footer">
              <div>
                <div class="product-price">$${p.price.toFixed(2)}</div>
                <div class="product-stock ${stockClass}">${stockText}</div>
              </div>
              <button class="btn-add" onclick="addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')})"
                ${outOfStock ? 'disabled' : ''} title="Agregar al carrito">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterProducts(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filtered = category ? allProducts.filter(p => p.category === category) : allProducts;
      renderProducts(filtered);
    }

    // Carrito
    function openCart()  {
      document.getElementById('cart-overlay').classList.add('open');
      document.getElementById('cart-drawer').classList.add('open');
    }

    function closeCart() {
      document.getElementById('cart-overlay').classList.remove('open');
      document.getElementById('cart-drawer').classList.remove('open');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // Sobrescribir addToCart para actualizar UI
    const _addToCart = addToCart;
    window.addToCart = function(product) {
      _addToCart(product);
      showToast(`${product.name} agregado al carrito`);
    };

    // Sobrescribir renderCart para actualizar contador
    const _renderCart = renderCart;
    window.renderCart = function() {
      _renderCart();
      const total = cart.reduce((s, i) => s + i.quantity, 0);
      document.getElementById('cart-count').textContent = total;
      document.getElementById('btn-checkout').disabled = cart.length === 0;
    };
  </script>
</body>
</html>
